<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Module 8 AI Puzzles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <svg class="bg-pattern" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="deco-pattern" width="260" height="260" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
                <rect x="20" y="24" width="20" height="20" rx="6" fill="#cff6e0" opacity="0.05" />
                <circle cx="180" cy="70" r="9" fill="#cfe8ff" opacity="0.045" />
                <polygon points="80,180 96,208 64,208" fill="#ece0ff" opacity="0.05" />
                <circle cx="220" cy="200" r="3" fill="#ffedbf" opacity="0.06" />
                <circle cx="236" cy="200" r="3" fill="#ffedbf" opacity="0.06" />
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#deco-pattern)" />
    </svg>

    <div class="page">
        <header class="hero">
            <h1 class="hero-title">Module 8 AI Puzzles</h1>
            <p class="hero-subtitle">Pick a puzzle to get started.</p>
        </header>

        <div id="menu">
            <a href="arc/" class="menu-btn" id="arc-btn">
                <span class="menu-btn-icon" aria-hidden="true">▦</span>
                <span class="menu-btn-label">Arc Puzzle</span>
            </a>
            <a href="bongard/" class="menu-btn" id="bongard-btn">
                <span class="menu-btn-icon" aria-hidden="true">◐</span>
                <span class="menu-btn-label">Bongard Puzzle</span>
            </a>
            <a href="winograd/" class="menu-btn" id="winograd-btn">
                <span class="menu-btn-icon" aria-hidden="true">❝</span>
                <span class="menu-btn-label">Winograd Puzzle</span>
            </a>
        </div>
    </div>

    <script src="onload.js"></script>
</body>

</html>
